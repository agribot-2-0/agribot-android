image: mingc/android-build-box:latest
pipelines:
  default:
    - step:
        name: "Check pylint"
        script:
          - apk add --update bash coreutils gcc python3-dev py3-pip musl-dev
          - pip3 install setuptools
          - pip3 install pylint
          - pylint --rcfile=.pylintrc scripts/*
    - step:
        name: Static code analysis (Debug)
        caches:
          - gradle
          - gradlewrapper
        script:
          - ./gradlew ktlint
          - ./gradlew spotlessCheck
          - ./gradlew lintDebug
    - step:
        name: Android Build (Debug)
        caches:
          - gradle
          - gradlewrapper
        script:
          - ./gradlew assembleDebug
        artifacts:
          - app/build/outputs/**
          - app/build/outputs/apk/debug/*.apk
  branches:
    develop:
        - step:
            name: Static code analysis (Release)
            caches:
              - gradle
              - gradlewrapper
            script:
              - ./gradlew ktlint
              - ./gradlew spotlessCheck
              - ./gradlew lintRelease
        - step:
            name: Android Build (Release)
            caches:
              - gradle
              - gradlewrapper
            script:
              - echo "$SIGNING_JKS_FILE" | base64 -di > agribot-android-upload-keystore.jks
              - ./gradlew assembleRelease
            artifacts:
              - app/build/outputs/**
              - app/build/outputs/apk/release/*.apk
    release/internal:
        - step:
            name: Static code analysis (Release)
            caches:
              - gradle
              - gradlewrapper
            script:
              - ./gradlew ktlint
              - ./gradlew spotlessCheck
              - ./gradlew lintRelease
        - step:
            name: Android Publish (Internal)
            caches:
              - gradle
              - gradlewrapper
            script:
              - echo $GOOGLE_API_KEY_JSON > google_play_api_key.json
              - echo "$SIGNING_JKS_FILE" | base64 -di > agribot-android-upload-keystore.jks
              - ./gradlew publishReleaseBundle --track internal --release-name "BitBucket CI Internal Deployment $BITBUCKET_BUILD_NUMBER"
definitions:
  caches:
    gradlewrapper: ~/.gradle/wrapper
    androidavd: $ANDROID_HOME/.android/avd
