apply from: "allprojects.gradle"
apply from: "clean.gradle"
apply from: "ktlint.gradle"
apply from: "spotless.gradle"
apply from: "dependencyupdates.gradle"

buildscript {
    ext.kotlin_version = '1.3.72'
    ext.android_gradle_version = '4.0.0'
    ext.spotless_version = '3.25.0'
    ext.localization_version = '1.0.16'
    ext.versions_version = "0.27.0"
    ext.play_version = "2.7.2"
    ext.services_version = "4.3.3"


    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.fabric.io/public' }
        jcenter()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${android_gradle_version}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
        classpath "com.diffplug.spotless:spotless-plugin-gradle:${spotless_version}"
        classpath "com.github.ben-manes:gradle-versions-plugin:${versions_version}"
        classpath "com.github.triplet.gradle:play-publisher:${play_version}"
        classpath "com.google.gms:google-services:${services_version}"
    }
}