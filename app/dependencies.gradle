def versions = [
		'appCompat'       : '1.1.0',
		'constraintLayout': '1.1.3',
		'androidCore'     : '1.2.0',
		'coroutines'      : '1.3.4',
		'flipper'         : '0.35.0',
		'koin'            : '2.1.5',
		'legacy'          : '1.0.0',
		'lifecycle'       : '2.2.0',
		'material'        : '1.1.0',
		'materialDialogs' : '3.3.0',
		'navigation'      : '2.2.1',
		'soloader'        : '0.8.2',
		'timber'          : '4.7.1'
]

dependencies {
	// Importing all *.jar files from 'libs' directory
	implementation fileTree(dir: 'libs', include: ['*.jar'])

	// Kotlin Core
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
	implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

	// Android Core
	implementation "androidx.core:core:$versions.androidCore"
	implementation "androidx.core:core-ktx:$versions.androidCore"
	implementation "androidx.appcompat:appcompat:$versions.appCompat"
	implementation "androidx.legacy:legacy-support-v4:$versions.legacy"

	// UI
	implementation "com.google.android.material:material:$versions.material"
	implementation "androidx.constraintlayout:constraintlayout:$versions.constraintLayout"

	// Lifecycle
	implementation "androidx.lifecycle:lifecycle-extensions:$versions.lifecycle"
	implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$versions.lifecycle"

	// Navigation component
	implementation "androidx.navigation:navigation-fragment-ktx:$versions.navigation"
	implementation "androidx.navigation:navigation-ui-ktx:$versions.navigation"

	// Coroutines
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$versions.coroutines"
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$versions.coroutines"

	// Koin Dependency Injection
	implementation "org.koin:koin-android:$versions.koin"
	implementation "org.koin:koin-androidx-ext:$versions.koin"
	implementation "org.koin:koin-androidx-scope:$versions.koin"
	implementation "org.koin:koin-androidx-viewmodel:$versions.koin"

	// Logging
	implementation "com.jakewharton.timber:timber:$versions.timber"

	// Flipper
	debugImplementation "com.facebook.soloader:soloader:$versions.soloader"
	debugImplementation "com.facebook.flipper:flipper:$versions.flipper"
	releaseImplementation "com.facebook.flipper:flipper-noop:$versions.flipper"

	// Dialogs
	implementation "com.afollestad.material-dialogs:core:$versions.materialDialogs"
	implementation "com.afollestad.material-dialogs:lifecycle:$versions.materialDialogs"

}
