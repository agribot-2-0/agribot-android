def versions = [
		'appCompat'        : '1.1.0',
		'constraintLayout' : '2.0.4',
		'androidCore'      : '1.3.2',
		'coroutines'       : '1.3.9',
		'flipper'          : '0.61.0',
		'koin'             : '2.1.5',
		'legacy'           : '1.0.0',
		'lifecycle'        : '2.2.0',
		'material'         : '1.2.1',
		'materialDialogs'  : '3.3.0',
		'navigation'       : '2.3.2',
		'soloader'         : '0.9.0',
		'timber'           : '4.7.1',
		'googleMap'        : '17.0.0',
		'joystick'         : '1.10.1',
		'localeManager'    : '1.0.0',
		'supportDesign'    : '28.0.0',
		'firebaseAuth'     : '19.4.0',
		'playVersion'      : '15.0.0',
		'serviceAuth'      : '18.1.0',
		'dexter'           : '6.2.1',
		'firestore'        : '22.0.0',
		'firestorage'      : '19.2.0',
		'mapUtils'         : '0.4.4',
		'downloader'       : '0.6.0',
		'ijkPlayer'        : '0.8.8-full',
		'videoPlayer'      : '0.1.25-full',
		'zip4j'            : '2.6.4',
		'camerax'          : '1.1.0-alpha01',
		'glide'            : '4.12.0',
		'cameraxView'      : '1.0.0-alpha21',
		'recyclerDecorator': '1.2.3',
		'okHttp'           : '4.9.0',
		'okHttpLogger'     : '3.6.0',
		'gson'             : '2.8.6',
		'mpChart'          : 'v3.1.0',
		'retrofit'         : '2.4.0'


]

dependencies {
	// Importing all *.jar files from 'libs' directory
	implementation fileTree(dir: 'libs', include: ['*.jar'])

	// Kotlin Core
	implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
	implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"

	// Android Core
	implementation "androidx.core:core:$versions.androidCore"
	implementation "androidx.core:core-ktx:$versions.androidCore"
	implementation "androidx.appcompat:appcompat:$versions.appCompat"
	implementation "androidx.legacy:legacy-support-v4:$versions.legacy"

	// UI
	implementation "com.google.android.material:material:$versions.material"
	implementation "androidx.constraintlayout:constraintlayout:$versions.constraintLayout"

	// Lifecycle
	implementation "androidx.lifecycle:lifecycle-extensions:$versions.lifecycle"
	implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$versions.lifecycle"

	// Navigation component
	implementation "androidx.navigation:navigation-fragment-ktx:$versions.navigation"
	implementation "androidx.navigation:navigation-ui-ktx:$versions.navigation"

	// Coroutines
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$versions.coroutines"
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$versions.coroutines"

	// Koin Dependency Injection
	implementation "org.koin:koin-android:$versions.koin"
	implementation "org.koin:koin-androidx-ext:$versions.koin"
	implementation "org.koin:koin-androidx-scope:$versions.koin"
	implementation "org.koin:koin-androidx-viewmodel:$versions.koin"

	// Logging
	implementation "com.jakewharton.timber:timber:$versions.timber"

	// Flipper
	debugImplementation "com.facebook.soloader:soloader:$versions.soloader"
	debugImplementation "com.facebook.flipper:flipper:$versions.flipper"
	releaseImplementation "com.facebook.flipper:flipper-noop:$versions.flipper"

	// Dialogs
	implementation "com.afollestad.material-dialogs:core:$versions.materialDialogs"
	implementation "com.afollestad.material-dialogs:input:$versions.materialDialogs"
	implementation "com.afollestad.material-dialogs:lifecycle:$versions.materialDialogs"


	//GoogleMap
	implementation "com.google.android.gms:play-services-maps:$versions.googleMap"

	//Joystick
	implementation "io.github.controlwear:virtualjoystick:$versions.joystick"

	implementation "com.ninenox.kotlinlocalemanager:kotlin-locale-manager:$versions.localeManager"

	//AndroidDesign
	implementation "com.android.support:design:$versions.supportDesign"

	//FirebaseAuth
	implementation "com.google.android.gms:play-services-auth:$versions.serviceAuth"
	implementation "com.google.firebase:firebase-auth:$versions.firebaseAuth"

	//FirebaseFirestore
	implementation "com.google.firebase:firebase-firestore-ktx:$versions.firestore"

	//FirebaseFiresorage
	implementation "com.google.firebase:firebase-storage-ktx:$versions.firestorage"

	//Dexter
	implementation "com.karumi:dexter:$versions.dexter"

	//MapUtility
	implementation "com.google.maps.android:android-maps-utils:$versions.mapUtils"

	//PRDownloader
	implementation "com.mindorks.android:prdownloader:$versions.downloader"

	//VideoPlayer
	api "com.github.tcking:giraffeplayer2:$versions.videoPlayer"

	//ijkPlayer
	api "com.github.tcking:ijkplayer-arm64:$versions.ijkPlayer" //support arm64
	api "com.github.tcking:ijkplayer-armv5:$versions.ijkPlayer" //support armv5
	api "com.github.tcking:ijkplayer-x86:$versions.ijkPlayer" //support x86
	api "com.github.tcking:ijkplayer-x86_64:$versions.ijkPlayer" //support x86_64

	//Unzip
	implementation "net.lingala.zip4j:zip4j:$versions.zip4j"

	// CameraX core library
	implementation "androidx.camera:camera-core:$versions.camerax"

	// CameraX Camera2 extensions
	implementation "androidx.camera:camera-camera2:$versions.camerax"

	// CameraX Lifecycle library
	implementation "androidx.camera:camera-lifecycle:$versions.camerax"

	// CameraX View class
	implementation "androidx.camera:camera-view:$versions.cameraxView"

	// Glide
	implementation "com.github.bumptech.glide:glide:$versions.glide"
	kapt "com.github.bumptech.glide:compiler:$versions.glide"

	//Recycler Decorator
	implementation "it.xabaras.android:recyclerview-swipedecorator:$versions.recyclerDecorator"

	// OkHttp
	implementation "com.squareup.okhttp3:okhttp:$versions.okHttp"
	implementation "com.squareup.okhttp3:logging-interceptor:$versions.okHttpLogger"

	// Gson
	implementation "com.google.code.gson:gson:$versions.gson"

	//Chart
	implementation "com.github.PhilJay:MPAndroidChart:$versions.mpChart"

	implementation "com.squareup.retrofit2:retrofit:$versions.retrofit"
	implementation "com.squareup.retrofit2:converter-gson:$versions.retrofit"

}
