image: mingc/android-build-box:latest
pipelines:
  default:
    - step:
        name: Static code analysis
        caches:
          - gradle
        script:
          - ./gradlew ktlint
          - ./gradlew spotlessCheck
    - step:
        name: Android Lint (Debug)
        caches:
          - gradle
        script:
          - ./gradlew lintDebug
    - step:
        name: Android Build (Debug)
        caches:
          - gradle
        script:
          - ./gradlew assembleDebug
        artifacts:
          - app/build/outputs/**